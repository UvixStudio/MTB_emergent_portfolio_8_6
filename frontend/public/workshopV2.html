<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Yuval's Workshop — 3D Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Ruda:wght@800&display=swap" rel="stylesheet" />
<style>
  :root { --cy:#00e5ff; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#070a11;overflow:hidden;
            font-family:ui-monospace,"SF Mono",Menlo,monospace;color:#c8dced}
  #app{position:fixed;inset:0}
  .pane{position:fixed;z-index:10;background:rgba(7,11,18,.82);
        border:1px solid rgba(0,229,255,.22);backdrop-filter:blur(10px);
        padding:11px 13px;font-size:11px;letter-spacing:.09em;
        clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
  #hud{left:14px;top:14px;line-height:1.85;text-transform:uppercase}
  #hud b{color:var(--cy);font-weight:600}
  #hud .dim{opacity:.5}
  #ctl{right:14px;top:14px;width:246px}
  #ctl{display:none;top:54px;max-height:calc(100vh - 68px);overflow-y:auto}
  .product-settings{font:11px ui-monospace,monospace;letter-spacing:0;line-height:1.45}
  .product-settings h3{font-size:12px;color:var(--cy);margin:2px 0 8px}
  .product-settings label{display:block;margin:7px 0}
  .product-settings output{float:left;color:var(--cy)}
  .product-settings input[type=range]{display:block;width:100%;accent-color:var(--cy)}
  .product-settings p{margin:7px 0}
  body.tools-open #ctl{display:block}
  #toolsToggle{position:fixed;right:14px;top:14px;width:auto;z-index:12;margin:0;padding:8px 12px}
  .row{display:flex;align-items:center;gap:7px;margin:5px 0}
  .row span{flex:0 0 46px;opacity:.72;text-transform:uppercase;font-size:10px}
  .row input[type=range]{flex:1;accent-color:var(--cy);height:3px}
  .row .val{flex:0 0 40px;text-align:right;color:var(--cy);font-size:10.5px}
  .sep{height:1px;background:rgba(255,255,255,.12);margin:9px 0}
  select,button{width:100%;background:#0d1522;color:#cfe6f5;border:1px solid rgba(255,255,255,.16);
                padding:5px 7px;font:11px ui-monospace,monospace;letter-spacing:.08em}
  button{cursor:pointer;margin-top:7px;text-transform:uppercase}
  button:hover{border-color:var(--cy);color:var(--cy)}
  input[type=color]{width:100%;height:22px;border:1px solid rgba(255,255,255,.16);
                    background:#0d1522;padding:1px;cursor:pointer}
  #err{position:fixed;inset:auto 0 0 0;padding:12px;background:#3a0d12;color:#ffb4b4;
       font-size:12px;display:none;z-index:20;white-space:pre-wrap}
  #tvBar{left:50%;bottom:18px;transform:translateX(-50%);display:none;align-items:center;gap:10px;
         flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 28px)}
  #tvBar.show{display:flex}
  #tvBar button{width:auto;margin:0;min-width:86px;padding:7px 12px}
  #tvBar label{display:flex;align-items:center;gap:8px;text-transform:uppercase;font-size:10px;opacity:.85}
  #tvBar input[type=range]{width:96px;accent-color:var(--cy);height:3px}
  #tvBar .sound.off{display:none}
  /* The visible TV button is a 3D decal on the screen; this HTML twin is only for keyboard / screen readers. */
  #tvFocus{position:fixed;left:-9999px;top:0;width:1px;height:1px;overflow:hidden}
  #tvFocus:focus-visible{left:16px;top:16px;width:auto;height:auto;padding:8px 12px;z-index:30;background:#03090f;color:#4fe6ff;border:1px solid #4fe6ff}
  #tvFocus svg{display:none}
  /* Onboarding hints: small ribbon-style tips that appear when relevant and leave once the action is done. */
  /* Deliberately NOT the ribbon language: rounded frosted-glass bubble, thin cyan hairline, no amber,
     plus a small caret pointing at whatever the tip is about. */
  .hint{position:fixed;left:0;top:0;z-index:13;display:flex;align-items:center;gap:8px;pointer-events:none;opacity:0;
        transition:opacity .4s ease, translate .4s ease;translate:0 6px;
        font:600 13px/1.2 Ruda,ui-sans-serif,sans-serif;letter-spacing:.02em;color:rgba(230,251,255,.92);white-space:nowrap;
        padding:8px 14px 8px 11px;border-radius:999px;
        background:rgba(0,6,12,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
        border:1px solid rgba(79,230,255,.55);box-shadow:0 0 18px rgba(79,230,255,.12)}
  .hint.show{opacity:1;translate:0 0}
  .hint .tag{color:#4fe6ff;font-size:14px;line-height:1;opacity:.9}
  .hint .txt b{color:#4fe6ff;font-weight:700}
  .hint.point::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;margin-left:-5px;
        background:rgba(0,6,12,.5);border-right:1px solid rgba(79,230,255,.55);border-bottom:1px solid rgba(79,230,255,.55);
        transform:rotate(45deg);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  /* Bouncing down-pointing triangle that hops from product to product during the "pick a project" tip. */
  .hint-ring{position:fixed;left:0;top:0;z-index:12;width:0;height:0;margin-left:-13px;pointer-events:none;opacity:0;
        border-left:13px solid transparent;border-right:13px solid transparent;border-top:19px solid #ffb21f;
        filter:drop-shadow(0 0 7px rgba(255,178,31,.9));transition:opacity .3s}
  /* Yellow halo pulsing on the floor under the pointed-at product (sized/positioned from JS). */
  .hint-ring.show{opacity:1}
  .hint-ring i{display:none}
  .hint-bob{animation:hintBob .9s ease-in-out infinite}
  @keyframes hintBob{0%,100%{margin-top:-8px}50%{margin-top:0}}
  #hintsReplay{position:fixed;left:16px;bottom:16px;z-index:13;width:34px;height:38px;border:0;padding:0;cursor:pointer;
        background:#4fe6ff;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);opacity:.55;transition:opacity .2s,background .2s;
        font:800 16px Ruda,sans-serif;color:#050b10}
  #hintsReplay:hover,#hintsReplay:focus-visible{opacity:1;background:#ffb21f}
  @media (prefers-reduced-motion: reduce){.hint{transition:opacity .2s;translate:0 0}.hint-ring.show{animation:none}}
  /* Clean view by default; Ctrl+0 toggles the dev UI. */
  body:not(.ui-on) .pane, body:not(.ui-on) #mediaPanel, body:not(.ui-on) #toolsToggle{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<button id="tvFocus" type="button" aria-label="Watch full screen">TV · full screen</button>
<div class="hint" id="hint" role="status" aria-live="polite"><span class="tag" id="hintTag"></span><span class="txt" id="hintTxt"></span></div>
<div class="hint-ring" id="hintRing"></div>
<button id="hintsReplay" type="button" aria-label="Show tips again" title="Show tips again">?</button>
<details id="mediaPanel" style="position:fixed;bottom:16px;left:16px;z-index:15;background:#0c1623ed;border:1px solid #284151;padding:12px;max-width:340px;color:#d5e7ef;font:13px sans-serif">
<summary style="cursor:pointer">TV media · תמונה או וידאו</summary>
<p><label>קובץ מהמחשב <input id="tvFile" type="file" accept="image/*,video/mp4,video/webm"></label></p>
<input id="tvUrl" type="url" placeholder="קישור ישיר לתמונה / MP4 / WebM" style="width:100%;box-sizing:border-box">
<button id="tvLoad">הצג במסך</button><button id="tvPlay">נגן / השהה וידאו</button>
<button id="tvDemo">תמונת Bone Bash</button><button id="tvTeaser">Teaser video</button>
<p id="mediaStatus" role="status" style="max-width:310px;line-height:1.5">בחירת קובץ היא לתצוגה מקומית בלבד.</p>
</details>
<button id="toolsToggle" type="button" aria-expanded="false">Lighting controls</button>

<div class="pane" id="tvBar" role="group" aria-label="Screen video controls">
  <button id="barPlay" type="button">Pause</button>
  <button id="barMute" type="button" class="sound">Unmute</button>
  <label class="sound">Volume <input id="barVol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume"></label>
</div>

<div class="pane" id="hud">
  <div><b>Yuval's Workshop</b> · stage 1</div>
  <div class="dim">drag = orbit · scroll/pinch = zoom · 2-finger = pan</div>
  <div class="dim" id="stats">loading…</div>
  <div class="sep"></div>
  <div id="camInfo" style="text-transform:none;line-height:1.6">camera…</div>
  <button id="copyCam" type="button" style="pointer-events:auto">Copy camera view</button>
</div>

<div class="pane" id="ctl">
  <div class="row"><span>Bloom</span><input id="s_bloom" type="range" min="0" max="1.5" step="0.01" value="0.18"><i class="val" id="v_bloom">0.18</i></div>
  <div class="row"><span>Thresh</span><input id="s_thr" type="range" min="0" max="1.5" step="0.01" value="0.90"><i class="val" id="v_thr">0.90</i></div>
  <div class="row"><span>Expo</span><input id="s_exp" type="range" min="0.2" max="2.5" step="0.01" value="0.74"><i class="val" id="v_exp">0.74</i></div>
  <div class="row"><span>Env</span><input id="s_env" type="range" min="0" max="2" step="0.01" value="0.40"><i class="val" id="v_env">0.40</i></div>
  <div class="row"><span>Key</span><input id="s_key" type="range" min="0" max="5" step="0.05" value="2.10"><i class="val" id="v_key">2.10</i></div>
  <div class="row"><span>Ticker</span><input id="s_spd" type="range" min="-0.15" max="0.15" step="0.005" value="0.035"><i class="val" id="v_spd">0.035</i></div>

  <div class="sep"></div>
  <select id="matSel"></select>
  <div class="row" style="margin-top:7px"><span>Color</span><input id="m_col" type="color" value="#000000"></div>
  <div class="row"><span>Rough</span><input id="m_rgh" type="range" min="0" max="1" step="0.01" value="0.5"><i class="val" id="v_rgh">0.50</i></div>
  <div class="row"><span>Metal</span><input id="m_met" type="range" min="0" max="1" step="0.01" value="0"><i class="val" id="v_met">0.00</i></div>
  <div class="row"><span>Emis</span><input id="m_emi" type="range" min="0" max="8" step="0.05" value="0"><i class="val" id="v_emi">0.00</i></div>
  <button id="save">💾 Save look → repo</button>
  <button id="copy">Copy JSON to clipboard</button>
</div>

<div id="err"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader }      from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';
import { createWorkshopProducts } from './workshop-products-v2.js?v=20260929g';
import { createWorkshopProps } from './workshop-props-v2.mjs?v=20260928k';

const MODEL = 'models/workshop.glb?v=' + Date.now();
const errBox = document.getElementById('err');
const showErr = m => { errBox.style.display='block'; errBox.textContent = m; };
addEventListener('error', e => showErr('ERROR: ' + e.message));
if (location.protocol === 'file:')
  showErr('Opened via file:// — the .glb cannot load.\nUse  http://localhost:3003/workshop.html');

/* ---------- renderer ---------- */
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.74;      // baked from Yuval's saved look
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070a11);
scene.fog = new THREE.Fog(0x070a11, 24, 52);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.40;

const camera = new THREE.PerspectiveCamera(34, innerWidth/innerHeight, 0.1, 400);
camera.position.set(13.2, 10.2, 13.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.3, 0);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.minDistance = 3; controls.maxDistance = 55;
controls.maxPolarAngle = Math.PI * 0.495;
controls.update();
window.__workshopView = { camera, controls, debug: () => ({ camTween, focusMode, intro: INTRO.t, drift: DRIFT, arrowNext, arrowPrev, current: currentProject?.title,
  muted: tvVideo ? tvVideo.muted : null, toggleSound, soundBtn }) };
addEventListener('keydown', e => {
  if (e.ctrlKey && (e.key === '0' || e.code === 'Digit0' || e.code === 'Numpad0')) {
    e.preventDefault(); document.body.classList.toggle('ui-on');
  }
});

/* ---------- intro: glide from the wide overview to the close 3/4 hero angle ---------- */
const INTRO = {
  duration: 3.4,
  fromPos: camera.position.clone(), fromTarget: controls.target.clone(),
  // Hero shot picked by Yuval via "Copy camera view" (dist 9.81, polar 75.9°, azimuth 52.5°).
  toPos: new THREE.Vector3(7.7, 3.59, 5.04), toTarget: new THREE.Vector3(0.15, 1.2, -0.75),
  t: -1,                       // -1 = waiting for the model, then 0..1
};
function startIntro(){ INTRO.t = 0; controls.enabled = false; }
function stopIntro(){ if (INTRO.t < 0 || INTRO.t >= 1) return; INTRO.t = 1; controls.enabled = true; startHints?.(); }
// Any user input takes over immediately.
['pointerdown','wheel','touchstart'].forEach(ev => addEventListener(ev, stopIntro, { passive: true }));
/* ---------- camera readout (Ctrl+0 UI): live pose + copy-to-clipboard for handing a view over ---------- */
const camInfo = document.getElementById('camInfo');
function cameraPose(){
  const r = v => +v.toFixed(2);
  const offset = camera.position.clone().sub(controls.target);
  const sph = new THREE.Spherical().setFromVector3(offset);
  return {
    position: camera.position.toArray().map(r),
    target: controls.target.toArray().map(r),
    distance: r(sph.radius),
    polarDeg: r(THREE.MathUtils.radToDeg(sph.phi)),       // 0 = straight down from above, 90 = level
    azimuthDeg: r(THREE.MathUtils.radToDeg(sph.theta)),
    fov: camera.fov,
  };
}
let camInfoTick = 0;
function updateCamInfo(dt){
  if (!document.body.classList.contains('ui-on') || (camInfoTick += dt) < .2) return;
  camInfoTick = 0;
  const p = cameraPose();
  camInfo.innerHTML = `pos <b>${p.position.join(', ')}</b><br>target <b>${p.target.join(', ')}</b><br>dist <b>${p.distance}</b> · polar <b>${p.polarDeg}°</b> · azimuth <b>${p.azimuthDeg}°</b> · fov <b>${p.fov}</b>`;
}
document.getElementById('copyCam').onclick = e => {
  const text = 'Workshop camera view: ' + JSON.stringify(cameraPose());
  navigator.clipboard.writeText(text).then(() => flash(e.target, 'copied ✓', 'Copy camera view'))
    .catch(() => { console.log(text); flash(e.target, 'see console', 'Copy camera view'); });
};

function updateIntro(dt){
  if (INTRO.t < 0 || INTRO.t >= 1) return;
  INTRO.t = Math.min(1, INTRO.t + Math.min(dt, .1) / INTRO.duration);   // clamp: a background-tab pause never skips the glide
  const k = INTRO.t < .5 ? 4*INTRO.t**3 : 1 - (-2*INTRO.t + 2)**3 / 2;   // easeInOutCubic
  camera.position.lerpVectors(INTRO.fromPos, INTRO.toPos, k);
  controls.target.lerpVectors(INTRO.fromTarget, INTRO.toTarget, k);
  if (INTRO.t >= 1) { controls.enabled = true; startDrift(); startHints(); }
}

/* ---------- idle drift: the camera stays put and slowly "looks around" the room ---------- */
// Starts after the intro / after leaving the TV, stops on any input, resumes after 10 s idle from wherever the user left it.
// Disabled for now (felt a little seasick) — flip `enabled` to true to bring it back.
const DRIFT = { enabled: false, on: false, amp: 0, t: 0, idle: 0, baseDir: new THREE.Vector3(), yawDeg: 7, pitchDeg: 1.6 };
const _driftDir = new THREE.Vector3(), _driftRight = new THREE.Vector3(), _Y = new THREE.Vector3(0, 1, 0);
function startDrift(){ DRIFT.on = true; DRIFT.amp = 0; DRIFT.t = 0; DRIFT.baseDir.copy(controls.target).sub(camera.position); }
function haltDrift(){ DRIFT.on = false; DRIFT.idle = 0; }
['pointerdown','wheel','touchstart','keydown'].forEach(ev => addEventListener(ev, haltDrift, { passive: true }));
function updateDrift(dt){
  if (!DRIFT.enabled) return;
  const free = controls.enabled && !focusMode && camTween.t >= 1 && (INTRO.t < 0 || INTRO.t >= 1);
  if (!DRIFT.on) { if (free && (DRIFT.idle += dt) > 10) startDrift(); return; }
  if (!free) { haltDrift(); return; }
  DRIFT.t += Math.min(dt, .1); DRIFT.amp = Math.min(1, DRIFT.amp + dt / 3);            // ease in over 3 s
  const yaw = THREE.MathUtils.degToRad(DRIFT.yawDeg) * Math.sin(DRIFT.t * Math.PI * 2 / 24) * DRIFT.amp;
  const pitch = THREE.MathUtils.degToRad(DRIFT.pitchDeg) * Math.sin(DRIFT.t * Math.PI * 2 / 31) * DRIFT.amp;
  _driftDir.copy(DRIFT.baseDir).applyAxisAngle(_Y, yaw);
  _driftRight.crossVectors(_driftDir, _Y).normalize();
  _driftDir.applyAxisAngle(_driftRight, pitch);
  controls.target.copy(camera.position).add(_driftDir);
}

/* ---------- TV focus mode: the camera flies up to the big screen and back to the hero shot ---------- */
const tvFocusBtn = document.getElementById('tvFocus');
let focusMode = false;
const camTween = { t: 1, dur: 1.4, fromPos: new THREE.Vector3(), fromTarget: new THREE.Vector3(),
                   toPos: new THREE.Vector3(), toTarget: new THREE.Vector3(), done: null };
function flyTo(pos, target, dur, done){
  stopIntro();
  camTween.fromPos.copy(camera.position); camTween.fromTarget.copy(controls.target);
  camTween.toPos.copy(pos); camTween.toTarget.copy(target);
  camTween.t = 0; camTween.dur = dur; camTween.done = done || null; controls.enabled = false;
}
function updateCamTween(dt){
  if (camTween.t >= 1) return;
  camTween.t = Math.min(1, camTween.t + Math.min(dt, .1) / camTween.dur);
  const t = camTween.t, k = camTween.k = t < .5 ? 4*t**3 : 1 - (-2*t + 2)**3 / 2;
  camera.position.lerpVectors(camTween.fromPos, camTween.toPos, k);
  controls.target.lerpVectors(camTween.fromTarget, camTween.toTarget, k);
  if (t >= 1) camTween.done?.();
}
// Screen geometry in world space: centre, facing normal (towards the room), size and in-plane axes.
function tvFrame(){
  const box = new THREE.Box3().setFromObject(tvBacking), size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  const thin = size.x < size.z ? 'x' : 'z';
  const normal = new THREE.Vector3(); normal[thin] = Math.sign(-center[thin]) || 1;   // faces the room centre
  const up = new THREE.Vector3(0, 1, 0), right = new THREE.Vector3().crossVectors(normal.clone().negate(), up);
  return { center, normal, up, right, width: thin === 'x' ? size.z : size.x, height: size.y };
}
// Distance that makes the screen fill ~85% of the viewport on its limiting side.
function tvFocusView(){
  // .7 leaves room for the whole frame, with the arrows and info ribbon on its outer rim.
  const f = tvFrame(), half = THREE.MathUtils.degToRad(camera.fov / 2), fill = .7;
  const d = Math.max((f.height / 2) / Math.tan(half) / fill, (f.width / 2) / (Math.tan(half) * camera.aspect) / fill);
  return { pos: f.center.clone().addScaledVector(f.normal, d), target: f.center.clone(), distance: d };
}
// While flying to / watching / leaving the screen, the near plane sits just in front of it,
// so nothing between the camera and the TV (arches, props) can ever block the view.
let clipToScreen = false;
function setFocusClip(on){ clipToScreen = on; if (!on) { camera.near = .1; camera.updateProjectionMatrix(); } }
function updateFocusClip(){
  if (!clipToScreen || !tvBacking) return;
  const f = tvFrame(), dist = _toCam.copy(camera.position).sub(f.center).dot(f.normal);
  // Ramp the clip with the flight so the room doesn't vanish at take-off.
  const amount = camTween.t < 1 ? (focusMode ? camTween.k : 1 - camTween.k) : (focusMode ? 1 : 0);
  const near = Math.max(.1, .1 + (dist - .7) * amount);
  if (Math.abs(near - camera.near) > .01) { camera.near = near; camera.updateProjectionMatrix(); }
}
function enterFocus(){
  if (focusMode || !tvBacking) return;
  focusMode = true; document.body.classList.add('tv-focus'); completeHint('screen'); tvFocusBtn.setAttribute('aria-label', 'Exit full screen');
  setFocusClip(true);
  const v = tvFocusView(); flyTo(v.pos, v.target, 1.4);
  // The click is a user gesture, so the browser allows sound now.
  if (tvVideo) { wantMuted = false; tvVideo.muted = false; tvVideo.volume = wantVolume * tvGain; tvVideo.play().catch(() => {}); syncBar(); }
}
function exitFocus(){
  if (!focusMode) return;
  focusMode = false; document.body.classList.remove('tv-focus'); tvFocusBtn.setAttribute('aria-label', 'Watch full screen');
  if (tvVideo) { wantMuted = true; soundBlocked = false; tvVideo.muted = true; syncBar(); }   // back to the room = muted
  flyTo(INTRO.toPos, INTRO.toTarget, 1.4, () => { setFocusClip(false); controls.enabled = true; startDrift(); });
}
tvFocusBtn.addEventListener('click', e => { e.stopPropagation(); focusMode ? exitFocus() : enterFocus(); });
addEventListener('keydown', e => { if (e.key === 'Escape') exitFocus(); });
addEventListener('resize', () => { if (focusMode && camTween.t >= 1) { const v = tvFocusView(); camera.position.copy(v.pos); controls.target.copy(v.target); } });
// Click on the screen itself (not an orbit drag): enter focus, or play/pause while focused.
let tvDownAt = null;
addEventListener('pointerdown', e => { tvDownAt = [e.clientX, e.clientY]; });
addEventListener('click', e => {

const TICKER_TEXT = [
  'DAVINCI RESOLVE', 'AFTER EFFECTS', 'PHOTOSHOP', 'FIGMA', 'TOPAZ AI',
  'FREEPIK', 'MAGNIFIC', 'FLUX', 'VEO', 'KLING', 'GPT-4O', 'GEMINI',
  'UNITY WEBGL', 'PLAYCANVAS', 'SPLINE 3D', 'MIXAMO', 'SUBSTANCE',

function tickerTexture(){
  // width scales with the string so glyph density stays constant
  const FONT = 46, H = 96;
  const probe = document.createElement('canvas').getContext('2d');
  probe.font = `bold ${FONT}px ui-monospace, monospace`;
  const W = Math.ceil(probe.measureText(TICKER_TEXT).width);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = '#1a212c'; x.fillRect(0,0,W,H);      // dark blue-grey backing
  x.font = `bold ${FONT}px ui-monospace, monospace`;
  x.fillStyle = '#5fe6ff'; x.textBaseline = 'middle';
  x.fillText(TICKER_TEXT, 0, H/2 + 2);
  x.fillStyle = 'rgba(26,33,44,.88)';               // dot-matrix mask (matches backing)
  for (let i=0;i<W;i+=6) x.fillRect(i+4,0,2,H);
  for (let j=0;j<H;j+=6) x.fillRect(0,j+4,W,2);
  const t = new THREE.CanvasTexture(c);
  t.flipY = false;                     // glTF UV convention (CanvasTexture defaults to true)
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  // The UV strip spans ~17 m across BOTH walls but is only 0.30 m tall.
  // Repeat so texture pixels stay square -> glyphs never squash, whatever
  // the tool list length.
  const STRIP_LEN = 17.05, STRIP_H = 0.30;
  t.repeat.set(W / (H * (STRIP_LEN / STRIP_H)), 1);
  return t;
}
const tickerTex = tickerTexture();

function dotDisplayTexture(){
  const mask=document.createElement('canvas');mask.width=640;mask.height=12;
  const g=mask.getContext('2d');g.font='bold 9px monospace';g.fillStyle='#fff';g.textBaseline='middle';
  const phrase='YUVAL WORKSHOP / INNOVATION / BLENDER / THREE.JS / DESIGN + CODE / ';
  const phraseWidth=g.measureText(phrase).width;
  for(let start=0;start<640;start+=phraseWidth)g.fillText(phrase,start,6);
  const data=g.getImageData(0,0,640,12).data;
  const c=document.createElement('canvas');c.width=2560;c.height=48;
  const ctx=c.getContext('2d');ctx.fillStyle='#071019';ctx.fillRect(0,0,2560,48);ctx.fillStyle='#5fe6ff';
  for(let y=0;y<12;y++)for(let x=0;x<640;x++)if(data[(y*640+x)*4+3]>100){ctx.beginPath();ctx.arc(x*4+2,y*4+2,1.45,0,Math.PI*2);ctx.fill();}
  const t=new THREE.CanvasTexture(c);t.flipY=false;t.wrapS=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;
  t.repeat.set((8.35/.24)/(2560/48),1);t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t;
}
function beltTexture(){
  const c=document.createElement('canvas');c.width=128;c.height=32;const g=c.getContext('2d');
  g.fillStyle='#343b43';g.fillRect(0,0,128,32);g.fillStyle='#12191f';g.fillRect(0,0,9,32);g.fillStyle='#505962';g.fillRect(9,0,3,32);
  const t=new THREE.CanvasTexture(c);t.flipY=false;t.wrapS=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;return t;
}

/* ---------- load ---------- */
const MATS = new Map();

// Videos start with sound. Browsers block unmuted autoplay until the visitor first interacts with the page,
// so loadTV falls back to muted and the first click / key press anywhere turns the sound on.
// Sound policy: the scene plays muted by default. Sound comes on only when the visitor unmutes (speaker button)
// or enters full screen; leaving full screen mutes again. (unlockSound only matters if a browser blocked an unmute.)
let wantMuted=true,wantVolume=+barVol.value,soundBlocked=false;

  if(soundBlocked&&!wantMuted&&tvVideo){ tvVideo.muted=false; tvVideo.volume=wantVolume*tvGain; syncBar(); } soundBlocked=false; };

const hasAudio=v=>v.mozHasAudio!==undefined?v.mozHasAudio:(v.audioTracks?v.audioTracks.length>0:
  (v.webkitAudioDecodedByteCount!==undefined&&v.currentTime>.3?v.webkitAudioDecodedByteCount>0:true));
function syncBar(){
 if(!tvVideo){bar.classList.remove('show');return;}

}

 else{wantMuted=true;tvVideo.muted=true;}

function applyTVTexture(tex,w,h){
 tex.flipY=false;tex.colorSpace=THREE.SRGBColorSpace;tvTexture=tex;
 tvMesh.material.map=tex;tvMesh.material.needsUpdate=true;
 const a=w/h,screenAspect=16/9;

// Bone Bash loudness is baked into tv/bone-bash.* (-30%), so no runtime trims are needed.
const TV_GAIN={};let tvGain=1;

/* ---------- video prefetch: first video streams; the rest download quietly in the background ---------- */
// Desktop on a decent connection: once the first video has played smoothly for 3 s, the others are fetched one at a
// time (next project first; a hovered product / arrow jumps the queue) and kept in memory as blob URLs, so switching
// projects is instant. Touch devices, Save-Data and 2G/3G connections skip this and load each video on demand.
const PREFETCH_OK=(()=>{const c=navigator.connection;
  if(c?.saveData||/(^|-)(2g|3g)$/.test(c?.effectiveType||''))return false;
  return !matchMedia('(pointer: coarse)').matches;})();
const videoCache=new Map();            // url -> blob object URL
let prefetchQueue=[],prefetching=null,prefetchStarted=false;
function queuePrefetch(urls,front=false){
  urls=urls.filter(u=>u&&!videoCache.has(u)&&u!==prefetching);
  if(!urls.length)return;
  const rest=prefetchQueue.filter(u=>!urls.includes(u));
  prefetchQueue=front?[...urls,...rest]:[...rest,...urls];
  pumpPrefetch();
}
async function pumpPrefetch(){
  if(!PREFETCH_OK||!prefetchStarted||prefetching||!prefetchQueue.length)return;
  prefetching=prefetchQueue.shift();
  try{const r=await fetch(prefetching);if(r.ok)videoCache.set(prefetching,URL.createObjectURL(await r.blob()));}catch{}
  prefetching=null;pumpPrefetch();
}
function startPrefetch(){
  if(prefetchStarted)return;prefetchStarted=true;
  const list=productSystem?.projects||[],i=Math.max(0,list.indexOf(currentProject));
  queuePrefetch(list.map((_,k)=>list[(i+1+k)%list.length]).filter(p=>p.tv?.kind==='video').map(p=>pickTvUrl(p.tv)));
}
function prefetchProject(project){ if(project?.tv?.kind==='video')queuePrefetch([pickTvUrl(project.tv)],true); }
const posterFor=tv=>tv.kind==='video'&&/^tv\/[\w-]+\.mp4$/.test(tv.url)?tv.url.replace(/^tv\/([\w-]+)\.mp4$/,'tv/posters/$1.webp'):null;

async function loadTV(url,kind,fromFile=false,poster=null){
 if(!tvMesh){mediaStatus.textContent='המודל עדיין נטען';return;}
 if(/(?:youtube\.com|youtu\.be)/i.test(url)){mediaStatus.textContent='YouTube דורש נגן iframe נפרד. כאן יש להזין קישור ישיר לקובץ וידאו, או לבחור קובץ.';return;}
 const request=++mediaRequest;clearTV();if(fromFile)tvBlob=url;
 mediaStatus.textContent='טוען מדיה…';
 if(kind==='video'){
  const cached=videoCache.get(url);
  // Not in memory yet: show the poster frame straight away so the screen never goes black while it buffers.
  let videoReady=false;
  if(poster&&!cached)new THREE.TextureLoader().load(poster,tex=>{
    if(request!==mediaRequest||videoReady){tex.dispose();return;}
    applyTVTexture(tex,tex.image.width,tex.image.height);});
  const v=document.createElement('video');tvVideo=v;v.crossOrigin='anonymous';v.muted=true;
  v.setAttribute('muted','');v.setAttribute('playsinline','');   // mobile browsers need the attributes, not just the properties, to autoplaytvGain=TV_GAIN[url]??1;v.volume=wantVolume*tvGain;v.loop=true;v.playsInline=true;v.preload='auto';
  ['play','pause','volumechange','playing'].forEach(ev=>v.addEventListener(ev,()=>{if(v===tvVideo)syncBar();}));
  v.onloadeddata=async()=>{if(request!==mediaRequest)return;videoReady=true;
   if(tvTexture&&!tvTexture.isVideoTexture)tvTexture.dispose();          // drop the poster
   applyTVTexture(new THREE.VideoTexture(v),v.videoWidth,v.videoHeight);
   if(!wantMuted){v.muted=false;}
   try{await v.play();}catch{v.muted=true;soundBlocked=!wantMuted;try{await v.play();}catch{}}   // autoplay policy: fall back to muted until the first interaction
   mediaStatus.textContent='וידאו במסך · לולאה';syncBar();pulseTvButton();
   if(!prefetchStarted)setTimeout(startPrefetch,3000);};
  v.onerror=()=>{if(request===mediaRequest)mediaStatus.textContent='לא ניתן לטעון וידאו. בדוק פורמט והרשאת CORS של הקישור.';};v.src=cached||url;
 }else{
  try{const tex=await new THREE.TextureLoader().loadAsync(url);if(request!==mediaRequest){tex.dispose();return;}applyTVTexture(tex,tex.image.width,tex.image.height);mediaStatus.textContent='התמונה מוצגת ללא מתיחה או חיתוך';pulseTvButton();}
  catch{if(request===mediaRequest)mediaStatus.textContent='טעינת התמונה נכשלה. נסה קובץ מקומי או קישור עם הרשאת CORS.';}
 }
}

new GLTFLoader().load(MODEL, gltf => {
  let tris = 0, meshes = 0;

      g.translate(-center.x,-center.y,-center.z);o.position.add(center);

      backing.position.copy(o.position);backing.position.x-=.002;o.parent.add(backing);tvBacking=backing;

function snapshot(){
